services:

  db:
    image: postgres:16-alpine
    container_name: budget-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=budget_manager
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    container_name: budget-backend
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_URL=jdbc:postgresql://db:5432/budget_manager
      - DB_USER=user
      - DB_PASSWORD=postgres

  frontend:
    container_name: budget-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  adminer:
    image: adminer
    ports:
      - "8082:8080"

volumes:
  db_data: